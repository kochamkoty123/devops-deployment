name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ETAP 1: TEST
  test:
    name: 1. Unit Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Uruchomienie testów jednostkowych
        run: |
          pytest -v test_app.py

  # ETAP 2: BUILD
  build:
    name: 2. Docker Build & Validate
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Konfiguracja Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Budowanie obrazu Dockera
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: devops-flask-app:latest
          load: true

  # ETAP 3: DEPLOY
  deploy:
    name: 3. Deploy to Test Environment
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: test

    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Wdrożenie aplikacji w środowisku testowym (Docker Compose)
        run: |
          docker compose up -d
          echo "Oczekiwanie na uruchomienie serwisów..."
          sleep 6

      - name: Weryfikacja działania (Smoke Test & Health Check)
        run: |
          echo "Sprawdzanie stanu aplikacji przez endpoint /health:"
          curl --fail http://localhost:5001/health
          echo -e "\nSprawdzanie strony głównej:"
          curl --fail http://localhost:5001
          echo -e "\nKontenery działają poprawnie:"
          docker compose ps

      - name: Czyszczenie środowiska testowego
        if: always()
        run: |
          docker compose down
